name: Refresh profile visuals

on:
  schedule:
    # Monday 03:17 KST. Off the hour to reduce scheduled-run congestion.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare generated asset directory
        run: mkdir -p assets/generated

      - name: Generate light public activity card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2 lineage, pinned
        with:
          card: stats
          core_version: 2.1.5
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&hide_border=true&theme=default
          path: assets/generated/github-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark public activity card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2 lineage, pinned
        with:
          card: stats
          core_version: 2.1.5
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&hide_border=true&theme=github_dark
          path: assets/generated/github-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate 3D contribution garden
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586 # v0.9.3 lineage, pinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit refreshed visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/github-stats-light.svg assets/generated/github-stats-dark.svg profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "Profile visuals are already current."
            exit 0
          fi
          git commit -m "refresh profile visuals"
          git push
