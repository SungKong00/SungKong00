name: Refresh profile visuals

on:
  schedule:
    # Monday 03:17 KST. Off the hour to reduce scheduled-run congestion.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare generated asset directory
        run: mkdir -p assets/generated

      - name: Generate light public activity card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2 lineage, pinned
        with:
          card: stats
          core_version: 2.1.5
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&hide_border=true&disable_animations=true&theme=default
          path: assets/generated/github-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark public activity card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2 lineage, pinned
        with:
          card: stats
          core_version: 2.1.5
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&hide_border=true&disable_animations=true&theme=github_dark
          path: assets/generated/github-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0, pinned
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/github-snake.svg?color_snake=#7C3AED&color_dots=#F5F3FF,#DDD6FE,#C4B5FD,#8B5CF6,#6D28D9
            assets/generated/github-snake-dark.svg?color_snake=#5EEAD4&color_dots=#211634,#3B2B5C,#5B3F8C,#7C3AED,#A78BFA

      - name: Commit refreshed visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/github-stats-light.svg assets/generated/github-stats-dark.svg assets/generated/github-snake.svg assets/generated/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Profile visuals are already current."
            exit 0
          fi
          git commit -m "refresh profile visuals"
          git push
