<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Noh Sung Been — Backend and AI Systems Builder</title>
  <desc id="desc">A dark technical banner connecting backend, AI systems, and product delivery with a waveform-inspired system diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0a1f24"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="318" rx="28" fill="url(#bg)" stroke="#5eead4" stroke-opacity="0.26"/>
  <rect x="1" y="1" width="1198" height="318" rx="28" fill="url(#grid)"/>
  <g opacity="0.12">
    <circle cx="1080" cy="62" r="118" fill="#2dd4bf"/>
    <circle cx="1140" cy="270" r="150" fill="#3b82f6"/>
  </g>
  <g transform="translate(62 58)">
    <text x="0" y="24" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="3">SYSTEM / SUNGKONG00</text>
    <text x="0" y="91" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="750">NOH SUNG BEEN</text>
    <text x="2" y="132" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="500">Backend &amp; AI Systems Builder</text>
    <g transform="translate(0 164)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650">
      <rect width="118" height="36" rx="18" fill="#0f2f2d" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="59" y="23" text-anchor="middle" fill="#99f6e4">BACKEND</text>
      <rect x="130" width="126" height="36" rx="18" fill="#0c2932" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="193" y="23" text-anchor="middle" fill="#a5f3fc">AI SYSTEMS</text>
      <rect x="268" width="126" height="36" rx="18" fill="#14294a" stroke="#60a5fa" stroke-opacity="0.7"/>
      <text x="331" y="23" text-anchor="middle" fill="#bfdbfe">PRODUCT</text>
    </g>
  </g>
  <g>
    <rect x="748" y="60" width="382" height="200" rx="22" fill="#0b1625" fill-opacity="0.88" stroke="#5eead4" stroke-opacity="0.23"/>
    <text x="772" y="94" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">RELIABLE SIGNAL FLOW</text>
    <path d="M780 172H820L836 138L858 214L880 156L900 184L922 128L946 210L968 160L992 172H1098" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <g fill="#0b1625" stroke="#5eead4" stroke-width="3">
      <circle cx="780" cy="172" r="9"/>
      <circle cx="1098" cy="172" r="9"/>
    </g>
    <g fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="650">
      <text x="770" y="234">INPUT</text>
      <text x="899" y="234">VERIFY</text>
      <text x="1069" y="234">SHIP</text>
    </g>
  </g>
</svg>
