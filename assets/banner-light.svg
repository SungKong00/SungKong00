<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Noh Sung Been — Backend and AI Systems Builder</title>
  <desc id="desc">A light technical banner connecting backend, AI systems, and product delivery with a waveform-inspired system diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8f7f5"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.52" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="318" rx="28" fill="url(#bg)" stroke="#0f766e" stroke-opacity="0.22"/>
  <rect x="1" y="1" width="1198" height="318" rx="28" fill="url(#grid)"/>
  <g opacity="0.16">
    <circle cx="1080" cy="62" r="118" fill="#2dd4bf"/>
    <circle cx="1140" cy="270" r="150" fill="#60a5fa"/>
  </g>
  <g transform="translate(62 58)">
    <text x="0" y="24" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="3">SYSTEM / SUNGKONG00</text>
    <text x="0" y="91" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="750">NOH SUNG BEEN</text>
    <text x="2" y="132" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="500">Backend &amp; AI Systems Builder</text>
    <g transform="translate(0 164)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650">
      <rect width="118" height="36" rx="18" fill="#ccfbf1" stroke="#5eead4"/>
      <text x="59" y="23" text-anchor="middle" fill="#115e59">BACKEND</text>
      <rect x="130" width="126" height="36" rx="18" fill="#cffafe" stroke="#67e8f9"/>
      <text x="193" y="23" text-anchor="middle" fill="#155e75">AI SYSTEMS</text>
      <rect x="268" width="126" height="36" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="331" y="23" text-anchor="middle" fill="#1e40af">PRODUCT</text>
    </g>
  </g>
  <g>
    <rect x="748" y="60" width="382" height="200" rx="22" fill="#ffffff" fill-opacity="0.82" stroke="#0f766e" stroke-opacity="0.2"/>
    <text x="772" y="94" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">RELIABLE SIGNAL FLOW</text>
    <path d="M780 172H820L836 138L858 214L880 156L900 184L922 128L946 210L968 160L992 172H1098" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#0f766e" stroke-width="3">
      <circle cx="780" cy="172" r="9"/>
      <circle cx="1098" cy="172" r="9"/>
    </g>
    <g fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="650">
      <text x="770" y="234">INPUT</text>
      <text x="899" y="234">VERIFY</text>
      <text x="1069" y="234">SHIP</text>
    </g>
  </g>
</svg>
